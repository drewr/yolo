[package]
name = "yolo-broker-proxy"
description = "Sandbox-side CONNECT proxy that sends allowed hosts to the broker over iroh"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "yolo_broker_proxy"

[[bin]]
name = "yolo-broker-proxy"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
iroh.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
yolo-broker-wire = { path = "../wire" }
