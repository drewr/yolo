[package]
name = "yolo-broker"
description = "Credential broker: terminates TLS for allowed hosts and forwards through superfly/tokenizer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "yolo-broker"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64 = "0.23.1"
bytes = "1.12.1"
crypto_box = { version = "0.9", features = ["seal", "std"] }
http-body-util = "0.1.5"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
iroh.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
time = { version = "0.3.55", features = ["std"] }
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1.2.1"
tracing.workspace = true
zeroize = "1"
tracing-subscriber.workspace = true
yolo-broker-wire = { path = "../wire" }

[dev-dependencies]
tempfile = "3.27.0"
x509-parser = "0.18"
yolo-broker-proxy = { path = "../proxy" }
